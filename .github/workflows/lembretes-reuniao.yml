name: Lembretes de reuniao (Maquina ISP)

# Agendamento automatico (`schedule`) DESATIVADO em 2026-09-14 -- migrado pra
# Azure Functions (ver function_app.py::lembretes_reuniao). Motivo: repositorio
# privado no GitHub Free tem so 2.000 min gratis de Actions/mes; 2 crons de 15
# em 15 min estouraram isso em ~2 semanas, e sem spending limit configurado o
# GitHub parou de criar novos runs em SILENCIO (sem erro, sem run vermelho).
# Fica so `workflow_dispatch` pra rodar manualmente sem custo automatico.

on:
  workflow_dispatch: {}

concurrency:
  group: lembretes-reuniao-maquina-isp
  cancel-in-progress: false

jobs:
  lembretes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Enviar lembretes e varrer no-show
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RD_CRM_CLIENT_ID: ${{ secrets.RD_CRM_CLIENT_ID }}
          RD_CRM_CLIENT_SECRET: ${{ secrets.RD_CRM_CLIENT_SECRET }}
          RD_CRM_REDIRECT_URI: ${{ secrets.RD_CRM_REDIRECT_URI }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        run: python -m scripts.enviar_lembretes_reuniao
