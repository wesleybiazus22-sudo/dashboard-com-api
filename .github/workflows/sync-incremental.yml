name: Sincronizacao incremental RD CRM

# Roda a sincronizacao DENTRO do proprio runner, em vez de chamar a API no Render.
#
# A versao anterior fazia POST /sync/rd/incremental, que agenda a sincronizacao como
# BackgroundTask e responde na hora. Isso tinha dois pontos de falha que nao davam
# sinal nenhum de erro:
#   1. no plano free o servico dorme apos ~15 min sem trafego; o cold start podia
#      estourar o --max-time do curl e o ciclo era perdido em silencio;
#   2. mesmo quando respondia, o Render podia derrubar a instancia assim que a
#      requisicao terminava -- matando a sincronizacao no meio, com o `sync_state`
#      ja parcialmente avancado.
# Rodando aqui, a sincronizacao fala direto com o Postgres e o job so termina quando
# ela termina de verdade -- e falha visivelmente se algo der errado.

# Agendamento automatico (`schedule`) DESATIVADO em 2026-09-14 -- migrado pra
# Azure Functions (ver function_app.py::sync_e_reprocessar_leads). Motivo:
# repositorio privado no GitHub Free tem so 2.000 min gratis de Actions/mes;
# 2 crons de 15 em 15 min estouraram isso em ~2 semanas, e sem spending limit
# configurado o GitHub parou de criar novos runs em SILENCIO (sem erro, sem
# run vermelho). Fica so `workflow_dispatch` pra rodar manualmente sem custo
# automatico.

on:
  workflow_dispatch: {}

# Duas rodadas simultaneas competiriam pelo mesmo `sync_state` e pelo refresh do
# token OAuth. Se uma rodada demorar mais que o intervalo, a proxima espera.
concurrency:
  group: sync-rd-crm
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar sincronizacao incremental
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RD_CRM_CLIENT_ID: ${{ secrets.RD_CRM_CLIENT_ID }}
          RD_CRM_CLIENT_SECRET: ${{ secrets.RD_CRM_CLIENT_SECRET }}
          RD_CRM_REDIRECT_URI: ${{ secrets.RD_CRM_REDIRECT_URI }}
          # Meta Ads -- secrets que ainda nao existem no repositorio resolvem pra
          # string vazia (o GitHub nao falha por secret inexistente), e o proprio
          # sync detecta META_ACCESS_TOKEN vazio e pula essa etapa sem erro. Passam
          # a fazer efeito automaticamente assim que forem cadastrados em Settings
          # > Secrets and variables > Actions, sem precisar editar este arquivo.
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          # GA4 -- mesmo criterio: secret ausente vira string vazia e o sync pula
          # a etapa sozinho (ver `_sync_ga4` em ingestion/sync_all.py).
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python -m ingestion.sync_all incremental

      # Roda logo DEPOIS da sincronizacao, no MESMO job -- garante por
      # construcao que o contato ja esta sincronizado quando este script
      # verifica quem ainda nao recebeu o primeiro contato do agente. Fecha a
      # corrida em que o webhook da negociacao chega no Render antes do
      # contato sincronizar (ver docstring do script).
      - name: Reprocessar leads de trafego pago sem primeiro contato
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        run: python -m scripts.reprocessar_leads_trafego_pago
