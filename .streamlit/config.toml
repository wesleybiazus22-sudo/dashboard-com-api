# Tema visual do dashboard, alinhado ao Develcode Design System
# (claude.ai/design, projeto "Develcode Design System" -- tokens/colors.css).
# Fonte real (Satoshi/Montserrat) e raio de borda sao aplicados via CSS em
# app/theme.py:inject_brand(), chamado no topo de cada pagina.
[theme]
base = "light"
primaryColor = "#006FFF"
backgroundColor = "#F6F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17243B"
font = "sans serif"
